name: Deploy

# Continuous deployment: on merge to main (or manual dispatch), build and
# deploy Firestore rules + indexes and Hosting, run data migrations, and
# optionally deploy Functions / seed demo data.
#
# Required repository SECRETS:
#   FIREBASE_PROJECT_ID        – target Firebase/GCP project id
#   FIREBASE_SERVICE_ACCOUNT   – JSON key for the project's Firebase Admin SDK
#                                service account (Project settings → Service
#                                accounts → Generate new private key)
#   VITE_FIREBASE_API_KEY      – web app config (public values; from the
#   VITE_FIREBASE_AUTH_DOMAIN    firebaseConfig snippet in Project settings)
#   VITE_FIREBASE_APP_ID
#
# Optional repository VARIABLES (Settings → Secrets and variables → Actions →
# Variables):
#   DEPLOY_FUNCTIONS = true    – also deploy Cloud Functions (needs the Blaze
#                                plan; omit on the free Spark plan)
#   SEED_DEMO        = true    – seed a demo company, agent login and sample
#                                data after deploy (idempotent)
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function deps
        working-directory: functions
        run: npm ci

      - name: Build functions
        working-directory: functions
        run: npm run build

      # Hosting bundle. VITE_FIREBASE_* are public config, baked in at build time.
      - name: Build web app
        working-directory: web
        env:
          VITE_USE_EMULATORS: 'false'
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm ci && npm run build

      - name: Write service-account credentials
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "GCLOUD_PROJECT=$FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/functions/node_modules/.bin" >> "$GITHUB_PATH"

      # Free-plan baseline: rules, indexes and hosting (no billing needed).
      - name: Deploy Firestore rules, indexes and Hosting
        run: firebase deploy --only firestore,hosting --project "$FIREBASE_PROJECT_ID" --non-interactive

      # Opt-in: Cloud Functions require the Blaze plan.
      - name: Deploy Cloud Functions
        if: vars.DEPLOY_FUNCTIONS == 'true'
        run: firebase deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Run data migrations
        working-directory: functions
        run: npm run migrate

      # Opt-in: seed a demo company, agent login and sample data.
      - name: Seed demo data
        if: vars.SEED_DEMO == 'true'
        working-directory: functions
        env:
          ALLOWED_EMAILS: ${{ vars.ALLOWED_EMAILS }}
        run: npm run seed

      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
